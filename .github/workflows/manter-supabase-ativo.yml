    steps:
      - name: Fazer uma consulta simples ao banco (mantém o projeto ativo)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://vulfmcjebavvjuixorgv.supabase.co/rest/v1/bloqueios?select=data&limit=1" \
            -H "apikey: sb_publishable_0gqCLHIRs8UBtTtC2Ka0Zw_RkTq6qMK" \
